[package]
name = "cabin-platform-windows"
edition.workspace = true
license.workspace = true
version.workspace = true

[dependencies]
cabin-platform = { path = "../cabin-platform" }
cabin-core = { path = "../cabin-core" }
arboard = "3"
global-hotkey = "0.6"
tray-icon = "0.19"
image = { version = "0.25", default-features = false, features = ["png"] }
thiserror = "2"
# M3 Task 6：翻译 HTTP 客户端（同步、无 tokio）。默认特性关闭以避免 gzip 等冗余；
# "tls" = rustls（纯 Rust TLS，M4 复用）。localhost 明文 http 测试不经过 TLS。
ureq = { version = "2", default-features = false, features = ["tls"] }
# 有序表单 URL 编码（仅依赖 percent-encoding，不引入完整 url crate）。
form_urlencoded = "1"
serde_json = "1"
# M5 Task 2：下载流式 sha512 校验（与 cabin-core 同版本，不新增锁文件条目）。
sha2 = "0.10"
# windows 0.61 生成的 WinRT 异步类型（IAsyncOperation）位于 windows-future，
# Foundation 模块未再导出，OCR 轮询等待需要直接命名该类型。
windows-future = "0.2"
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_HiDpi",
    "Win32_Storage_FileSystem",
    "Win32_System_Registry",
    "Win32_System_Environment",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_GdiPlus",
    "Win32_Storage_Packaging",
    "Win32_Storage_Packaging_Appx",
    # OCR（M3 Task 6）：注意 windows 0.61 的 WinRT feature 名不带 "Windows_" 前缀。
    "Foundation",
    "Globalization",
    "Graphics_Imaging",
    "Media_Ocr",
    "Storage_Streams",
    # UI 修复 4：MSIX/APPX 打包应用枚举 —— PackageManager 位于
    # Windows.Management.Deployment，Package 位于 Windows.ApplicationModel，
    # AppListEntry 位于 Windows.ApplicationModel.Core。
    "ApplicationModel_Core",
    "Management_Deployment",
] }

[dev-dependencies]
# OCR 真机测试的文本 PNG 渲染（与 cabin-core 的 M3 T3 字体资产一致）。
fontdue = "0.9"

[target.'cfg(windows)'.dependencies]
# windows crate 在 Windows 上启用上述 feature 即完成链接；非 Windows 目标仅做类型检查

[lints]
workspace = true
